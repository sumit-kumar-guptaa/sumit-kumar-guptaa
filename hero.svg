<svg viewBox="0 0 1200 420" xmlns="http://www.w3.org/2000/svg" font-family="'Courier New', ui-monospace, monospace">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0B0F14"/>
      <stop offset="100%" stop-color="#12161D"/>
    </linearGradient>
    <linearGradient id="nameGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FFD9A8"/>
      <stop offset="100%" stop-color="#FF8C42"/>
    </linearGradient>
    <radialGradient id="sweepGrad" cx="0%" cy="0%" r="100%">
      <stop offset="0%" stop-color="#FFB577" stop-opacity="0.55"/>
      <stop offset="100%" stop-color="#FFB577" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect x="0" y="0" width="1200" height="420" fill="url(#bgGrad)"/>
  <rect x="18" y="18" width="1164" height="384" rx="16" fill="none" stroke="#FFB577" stroke-opacity="0.45" stroke-width="1.5"/>

  <!-- top bar -->
  <text x="46" y="52" font-size="13" letter-spacing="3" fill="#8B98A5">SUM-05 &#9656; ENGINEERING COMMAND CENTER</text>
  <circle cx="1096" cy="47" r="4" fill="#FFB577">
    <animate attributeName="opacity" values="1;0.25;1" dur="1.6s" repeatCount="indefinite"/>
  </circle>
  <text x="1110" y="52" font-size="12" letter-spacing="2" fill="#8B98A5">STATUS &#183; OPERATIONAL</text>

  <!-- operator line -->
  <circle cx="50" cy="94" r="4" fill="#FFB577">
    <animate attributeName="opacity" values="1;0.3;1" dur="1.8s" repeatCount="indefinite"/>
  </circle>
  <text x="64" y="98" font-size="13" letter-spacing="2" fill="#8B98A5">SYS.OPERATOR &#9656; ONLINE</text>

  <!-- name -->
  <text x="46" y="188" font-size="66" font-weight="700" fill="#E8EDF2">Sumit</text>
  <text x="46" y="258" font-size="66" font-weight="700" fill="url(#nameGrad)">Kumar Gupta</text>

  <text x="48" y="294" font-size="19" fill="#8B98A5">AI/ML Engineer &#183; Backend Engineer &#183; Distributed Systems</text>

  <!-- pills -->
  <g font-size="14" fill="#E8EDF2">
    <rect x="46" y="316" width="112" height="38" rx="19" fill="none" stroke="#FFB577" stroke-opacity="0.6"/>
    <text x="102" y="340" text-anchor="middle">PYTHON</text>

    <rect x="170" y="316" width="118" height="38" rx="19" fill="none" stroke="#FFB577" stroke-opacity="0.6"/>
    <text x="229" y="340" text-anchor="middle">PYTORCH</text>

    <rect x="300" y="316" width="96" height="38" rx="19" fill="none" stroke="#FFB577" stroke-opacity="0.6"/>
    <text x="348" y="340" text-anchor="middle">JAVA</text>

    <rect x="408" y="316" width="106" height="38" rx="19" fill="none" stroke="#FFB577" stroke-opacity="0.6"/>
    <text x="461" y="340" text-anchor="middle">KAFKA</text>
  </g>

  <!-- radar -->
  <g transform="translate(1000,150)">
    <circle r="90" fill="none" stroke="#8B98A5" stroke-opacity="0.25"/>
    <circle r="62" fill="none" stroke="#8B98A5" stroke-opacity="0.25"/>
    <circle r="34" fill="none" stroke="#8B98A5" stroke-opacity="0.25"/>
    <line x1="-90" y1="0" x2="90" y2="0" stroke="#8B98A5" stroke-opacity="0.18"/>
    <line x1="0" y1="-90" x2="0" y2="90" stroke="#8B98A5" stroke-opacity="0.18"/>

    <g>
      <path d="M0,0 L90,0 A90,90 0 0,0 63.6,-63.6 Z" fill="url(#sweepGrad)"/>
      <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="4s" repeatCount="indefinite"/>
    </g>

    <circle cx="34" cy="-14" r="4" fill="#FFB577">
      <animate attributeName="opacity" values="0;1;0" dur="2.4s" repeatCount="indefinite"/>
    </circle>
    <circle cx="-52" cy="26" r="3.5" fill="#FFB577">
      <animate attributeName="opacity" values="0;1;0" dur="3s" begin="0.8s" repeatCount="indefinite"/>
    </circle>
    <circle r="4" fill="#E8EDF2"/>
  </g>
  <text x="1000" y="264" text-anchor="middle" font-size="12" letter-spacing="2" fill="#8B98A5">RADAR &#9656; ACTIVE</text>

  <!-- bars -->
  <g font-size="13" letter-spacing="1.5" fill="#8B98A5">
    <text x="714" y="206">AI/ML SYSTEMS</text>
    <rect x="714" y="216" width="330" height="10" rx="5" fill="#8B98A5" fill-opacity="0.15"/>
    <rect x="714" y="216" height="10" rx="5" fill="#FFB577">
      <animate attributeName="width" from="0" to="277" dur="1.4s" fill="freeze"/>
    </rect>
    <text x="1058" y="225" fill="#E8EDF2">84</text>

    <text x="714" y="248">BACKEND SYSTEMS</text>
    <rect x="714" y="258" width="330" height="10" rx="5" fill="#8B98A5" fill-opacity="0.15"/>
    <rect x="714" y="258" height="10" rx="5" fill="#FFB577">
      <animate attributeName="width" from="0" to="304" dur="1.4s" fill="freeze"/>
    </rect>
    <text x="1058" y="267" fill="#E8EDF2">92</text>

    <text x="714" y="290">DISTRIBUTED SYSTEMS</text>
    <rect x="714" y="300" width="330" height="10" rx="5" fill="#8B98A5" fill-opacity="0.15"/>
    <rect x="714" y="300" height="10" rx="5" fill="#FFB577">
      <animate attributeName="width" from="0" to="257" dur="1.4s" fill="freeze"/>
    </rect>
    <text x="1058" y="309" fill="#E8EDF2">78</text>
  </g>

  <!-- status lines -->
  <g font-size="12" fill="#8B98A5">
    <text x="714" y="336" opacity="0"> [ ok ] runtime connected
      <animate attributeName="opacity" from="0" to="1" begin="1.6s" dur="0.4s" fill="freeze"/>
    </text>
    <text x="714" y="352" opacity="0"> [ ok ] telemetry upstream
      <animate attributeName="opacity" from="0" to="1" begin="2s" dur="0.4s" fill="freeze"/>
    </text>
  </g>

  <!-- terminal footer -->
  <text x="46" y="392" font-size="14" fill="#8B98A5">$ ./deploy --focus=ai-ml,backend --env=production</text>
  <rect x="472" y="380" width="9" height="16" fill="#FFB577">
    <animate attributeName="opacity" values="1;0;1" dur="1s" repeatCount="indefinite"/>
  </rect>

  <!-- equalizer ticks -->
  <g fill="#FFB577">
    <rect x="990" y="386" width="6" height="10"><animate attributeName="height" values="10;22;6;16;10" dur="1.3s" repeatCount="indefinite"/><animate attributeName="y" values="386;374;390;380;386" dur="1.3s" repeatCount="indefinite"/></rect>
    <rect x="1004" y="380" width="6" height="16" fill-opacity="0.7"><animate attributeName="height" values="16;8;20;12;16" dur="1.1s" repeatCount="indefinite"/><animate attributeName="y" values="380;388;376;384;380" dur="1.1s" repeatCount="indefinite"/></rect>
    <rect x="1018" y="388" width="6" height="8" fill-opacity="0.5"><animate attributeName="height" values="8;18;10;20;8" dur="1.5s" repeatCount="indefinite"/><animate attributeName="y" values="388;378;386;376;388" dur="1.5s" repeatCount="indefinite"/></rect>
    <rect x="1032" y="382" width="6" height="14" fill-opacity="0.8"><animate attributeName="height" values="14;24;8;18;14" dur="1.2s" repeatCount="indefinite"/><animate attributeName="y" values="382;372;388;378;382" dur="1.2s" repeatCount="indefinite"/></rect>
    <rect x="1046" y="390" width="6" height="6" fill-opacity="0.6"><animate attributeName="height" values="6;16;10;20;6" dur="1.4s" repeatCount="indefinite"/><animate attributeName="y" values="390;380;386;376;390" dur="1.4s" repeatCount="indefinite"/></rect>
  </g>
</svg>
